name: API CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practica-devops
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Ejecutar 17 pruebas y exigir cobertura mínima de 70 por ciento
        run: npm run test:coverage

  publish:
    name: Construir y publicar imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compilar y publicar latest y hash del commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexa-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexa-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar archivo PEM
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
      - name: Guardar secreto de la API en EC2
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        shell: bash
        run: |
          set +x
          printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN" | ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'umask 077; cat > /tmp/nexa-api.env; sudo mkdir -p /opt/nexa; sudo mv /tmp/nexa-api.env /opt/nexa/admin.env; sudo chmod 600 /opt/nexa/admin.env'
      - name: Despliegue blue green sin interrupción HTTP
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nexa-api:${{ github.sha }}
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "IMAGE='$IMAGE' bash -s" < practica-devops/deploy/deploy-blue-green.sh
